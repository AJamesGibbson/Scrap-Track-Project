plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    id 'com.google.gms.google-services' // Add this line at the bottom
}

android {
    namespace 'com.example.scraptrack'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.scraptrack"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.appcompat
    implementation libs.firebase.auth
    implementation libs.play.services.safetynet
    implementation libs.androidx.recyclerview
    implementation libs.material
    implementation libs.google.firebase.storage
    implementation libs.androidx.activity
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
    implementation(libs.firebase.analytics)
    implementation libs.recaptcha
    implementation 'com.google.android.play:integrity:1.4.0'
    implementation libs.firebase.auth.v2103
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation libs.google.firebase.auth
    implementation libs.firebase.database
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation libs.material.v180
    implementation 'androidx.navigation:navigation-fragment:2.8.3' // Replace with the latest version
    implementation 'androidx.navigation:navigation-ui:2.8.3' // Replace with the latest version
    implementation 'com.google.android.gms:play-services-auth:20.5.0' // For reCAPTCHA handling
    implementation 'com.google.android.gms:play-services-safetynet:18.0.1'
    implementation 'com.google.android.gms:play-services-base:18.4.0'
    implementation("com.google.firebase:firebase-appcheck-playintegrity")
    implementation("com.github.PhilJay:MPAndroidChart:v3.1.0")
    implementation 'com.github.bumptech.glide:glide:4.12.0'

}

apply plugin: 'com.google.gms.google-services'



